id = "ai-coding-mate"
name = "AI Coding Mate"
version = "0.1.0"
min_herdr_version = "0.7.0"
description = "Open a runtime-read diagnostic pane for AI Coding Mate."
platforms = ["macos", "linux"]

[[actions]]
id = "doctor"
title = "Run AI Coding Mate doctor"
contexts = ["workspace"]
command = ["bun", "bin/aicoding-mate", "doctor"]

[[actions]]
id = "context-branch"
title = "用 AI Coding Mate 深入了解選取內容"
contexts = ["selection"]
command = ["bun", "bin/aicoding-mate", "context-branch-start"]

[[actions]]
id = "codex-review"
title = "Open in Codex Review"
contexts = ["selection"]
command = ["bun", "bin/aicoding-mate", "codex-review-start"]

[[panes]]
id = "doctor"
title = "AI Coding Mate"
placement = "tab"
command = ["bun", "bin/aicoding-mate", "pane"]

[[panes]]
id = "quick"
title = "AI Coding Mate Quick"
placement = "tab"
command = ["bun", "bin/aicoding-mate", "quick-pane"]

[[panes]]
id = "standard"
title = "AI Coding Mate Standard"
placement = "tab"
command = ["bun", "bin/aicoding-mate", "standard-pane"]

[[panes]]
id = "adversarial"
title = "AI Coding Mate Adversarial"
placement = "tab"
command = ["bun", "bin/aicoding-mate", "adversarial-pane"]

[[panes]]
id = "research"
title = "AI Coding Mate Research"
placement = "tab"
command = ["bun", "bin/aicoding-mate", "research-pane"]

[[panes]]
id = "context-branch"
title = "AI Coding Mate Context Branch"
placement = "tab"
command = ["bun", "bin/aicoding-mate", "context-branch-pane"]
