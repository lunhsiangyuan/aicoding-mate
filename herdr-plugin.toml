id = "ai-coding-mate"
name = "Ari"
version = "0.3.3"
min_herdr_version = "0.7.0"
description = "Ari is the architect-facing Firstmate control layer for Herdr."
platforms = ["macos", "linux"]

[[actions]]
id = "doctor"
title = "Run Ari doctor"
contexts = ["workspace"]
command = ["bun", "bin/aicoding-mate", "doctor"]

[[actions]]
id = "context-branch"
title = "用 Ari 深入了解選取內容"
contexts = ["selection"]
command = ["bun", "bin/aicoding-mate", "context-branch-start"]

[[actions]]
id = "codex-review"
title = "Open in Codex Review"
contexts = ["selection"]
command = ["bun", "bin/aicoding-mate", "codex-review-start"]

[[panes]]
id = "mate"
title = "Ari"
placement = "overlay"
command = ["bun", "bin/aicoding-mate", "pane"]

[[panes]]
id = "context-branch"
title = "Ari Context Branch"
placement = "tab"
command = ["bun", "bin/aicoding-mate", "context-branch-pane"]
