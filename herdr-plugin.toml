id = "ai-coding-mate"
name = "AI Coding Mate"
version = "0.1.0"
min_herdr_version = "0.7.0"
description = "Open a runtime-read diagnostic pane for AI Coding Mate."
platforms = ["macos", "linux"]

[[actions]]
id = "doctor"
title = "Run AI Coding Mate doctor"
contexts = ["workspace"]
command = ["bun", "bin/aicoding-mate", "doctor"]

[[actions]]
id = "context-branch"
title = "用 AI Coding Mate 深入了解選取內容"
contexts = ["selection"]
command = ["bun", "bin/aicoding-mate", "context-branch-start"]

[[panes]]
id = "doctor"
title = "AI Coding Mate"
placement = "tab"
command = ["bun", "bin/aicoding-mate", "pane"]

[[panes]]
id = "quick"
title = "AI Coding Mate Quick"
placement = "tab"
command = ["bun", "bin/aicoding-mate", "quick-pane"]

[[panes]]
id = "standard"
title = "AI Coding Mate Standard"
placement = "tab"
command = ["bun", "bin/aicoding-mate", "standard-pane"]

[[panes]]
id = "context-branch"
title = "AI Coding Mate Context Branch"
placement = "tab"
command = ["bun", "bin/aicoding-mate", "context-branch-pane"]
