version: 1

model_aliases:
  strongest_reasoning:
    capability_floor: architecture
    preferred_families:
      - openai
      - anthropic
    fallback_behavior: stay_above_floor

  independent_judge:
    capability_floor: architecture
    require_different_family_from_author: true
    fallback_behavior: stay_above_floor

  balanced_builder:
    capability_floor: implementation
    fallback_behavior: automatic

  fast_research:
    capability_floor: search
    optimize_for:
      - cost
      - latency
      - recall
    fallback_behavior: automatic

roles:
  architect:
    model_alias: strongest_reasoning
    effort: maximum
  author:
    model_alias: balanced_builder
    effort: high
  reviewer:
    model_alias: strongest_reasoning
    effort: high
    prefer_different_family_from: author
  challenger:
    model_alias: strongest_reasoning
    effort: high
    prefer_different_family_from: author
  judge:
    model_alias: independent_judge
    effort: maximum
  search:
    model_alias: fast_research
    effort: low

quota_policy:
  gemini:
    reserve_for:
      - tie_break
      - final_spot_check

runtime_resolution:
  source: local_settings
  hardcode_provider_model_ids: false
  ask_user_when:
    - all_architect_fallbacks_below_floor
    - all_judge_fallbacks_below_floor
